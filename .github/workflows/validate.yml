# Runs on every push and pull request: checks the content packs against the
# spec and the school's grammar rules, and checks the JavaScript parses.
name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate content packs
        run: node scripts/validate-packs.mjs
      - name: Check JavaScript syntax
        run: for f in js/*.js js/views/*.js; do node --check "$f"; done
